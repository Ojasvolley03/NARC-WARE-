server.port=8085

spring.application.name=narc-ware-backend

# Database Configuration (H2 In-Memory with File Persistence)
spring.datasource.url=jdbc:h2:mem:narcwaredb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Enable H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Security JWT Secret
narcware.jwt.secret=NARC_WARE_SUPER_SECURE_LAWE_ENFORCEMENT_JWT_SECRET_KEY_2026_AGY
narcware.jwt.expiration-ms=86400000

# Python AI Service URL
narcware.ai-service.url=http://localhost:5005
